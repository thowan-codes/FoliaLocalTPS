group = 'legendary.hardcore'
version = '1.0.0'

subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven {
            name = 'papermc'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = 'canvasmc'
            url = 'https://maven.canvasmc.io/snapshots'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.register('platformJars', Copy) {
    group = 'build'
    description = 'Builds the Folia and Canvas plugin jars and copies them to dist.'
    dependsOn ':folia:jar', ':canvas:jar'

    from project(':folia').tasks.named('jar')
    from project(':canvas').tasks.named('jar')
    into layout.projectDirectory.dir('dist')
}
